[package]
name = "validator_league"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Validator League: a NEAR memecoin whose mechanic is fantasy sports on NEAR's own validator set"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.2"
near-contract-standards = "5.30.2"

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
